[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "s3-glacier-bulk-folder-restore"
version = "2.0.1"
description = "Recursively bulk-restore archived Amazon S3 objects (Glacier, Deep Archive, Intelligent-Tiering) under a prefix."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "Aloke Majumder" }]
keywords = ["aws", "s3", "glacier", "deep-archive", "restore", "backup", "archive"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Archiving :: Backup",
    "Topic :: Utilities",
]
dependencies = ["boto3>=1.28.0", "botocore>=1.31.0"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/alokemajumder/S3-Glacier-Bulk-Folder-Restore"
Issues = "https://github.com/alokemajumder/S3-Glacier-Bulk-Folder-Restore/issues"

[project.scripts]
s3-glacier-restore = "s3_glacier_restore.cli:main"

[project.gui-scripts]
s3-glacier-restore-gui = "s3_glacier_restore.gui:main"

[tool.setuptools]
packages = ["s3_glacier_restore"]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:s3_glacier_restore.*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
